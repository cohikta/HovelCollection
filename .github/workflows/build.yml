name: Build to artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'

    env:
      UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Setup MinGW-w64
        run: |
          echo "C:\mingw64\bin" >> $env:GITHUB_PATH
          gcc --version
        shell: pwsh

      - name: Build
        run: python scripts/build_windows.py ${{ matrix.arguments }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*-windows.zip
          if-no-files-found: error
          retention-days: 3
